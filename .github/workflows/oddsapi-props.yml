name: Odds API stat-line capture

# FP rebuild premise capture (CEO orders 2026-11-12): sportsbook PTS / REB / AST / PRA / STL / BLK / TO lines for tonight's
# untipped games (The Odds API per-event endpoint, seven markets, region us), archived raw in the PRIVATE repo arc-lab-data.
# Only the credit ledger and the coverage counts land in this repo. No request URL is ever logged.
#
# Schedule, decided by scripts/oddsapi_props.py `auto` from the free events listing and the ledger (one pull per label per slate):
#   morning   the first run inside 15:00-19:00 UTC, at least 90 minutes before the slate's earliest tip
#   pretip    the first run inside the 90 minutes before the earliest tip
#   board     slates of 12+ games only, and only on a board-push run: the first one 4 h to 2.5 h before the earliest tip
# Triggers: every Underdog board push (about every 30 minutes, pushed under the user's own account, so the pulls ride the board
# cycle and the optional third pull is taken at the moment of a board capture) plus hourly cron backstops, which GitHub
# fires late or not at all. A run with nothing due exits in seconds and touches nothing.
# Limits live in the script: 20,000 shared-pool floor, 1,000 credits per UTC day across every capture on the shared ledger.
# Any failure of a due pull (the token-expired case included) posts to Discord instead of dying quietly.

on:
  push:
    branches: [main]
    paths:
      - data/board_latest.json
  schedule:
    - cron: "17 15,16,17,18 * * *"        # morning backstop
    - cron: "47 20,21,22,23,0,1 * * *"    # pre-tip backstop
  workflow_dispatch:
    inputs:
      label:
        description: "auto = whatever is due now; anything else forces that pull"
        default: "auto"
        type: choice
        options: [auto, test, morning, pretip, board]

permissions:
  contents: write

concurrency:
  group: oddsapi-props
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: arc-lab
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests
      - name: What is due?
        id: decide
        working-directory: arc-lab/scripts
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          forced="${{ inputs.label }}"
          if [ -n "$forced" ] && [ "$forced" != "auto" ]; then
            echo "forced pull: $forced"; echo "due=$forced" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python oddsapi_props.py auto --event "${{ github.event_name }}" --check | tee /tmp/due.out
          echo "due=$(grep '^DUE=' /tmp/due.out | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.decide.outputs.due != ''
        with:
          repository: ${{ github.repository_owner }}/arc-lab-data
          token: ${{ secrets.ARC_LAB_DATA_TOKEN }}
          path: arc-lab-data
      - name: Pull tonight's untipped games, then the coverage inventory
        if: steps.decide.outputs.due != ''
        working-directory: arc-lab/scripts
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ARC_LAB_DATA_DIR: ${{ github.workspace }}/arc-lab-data
        run: |
          python oddsapi_props.py pull --label "${{ steps.decide.outputs.due }}" | tee /tmp/pull.out
          grep '^\[oddsapi-props\] ${{ steps.decide.outputs.due }}:' /tmp/pull.out >> "$GITHUB_STEP_SUMMARY" || true
      - name: Store the raw pull in arc-lab-data (private)
        if: always() && steps.decide.outputs.due != ''
        working-directory: arc-lab-data
        run: |
          git config user.name "arc-lab-bot"; git config user.email "actions@users.noreply.github.com"
          git add -A .
          git diff --cached --quiet && exit 0
          git commit -q -m "oddsapi props ${{ steps.decide.outputs.due }} $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q
      - name: Commit the ledger and coverage counts to arc-lab
        if: always() && steps.decide.outputs.due != ''
        working-directory: arc-lab
        run: |
          git config user.name "arc-lab-bot"; git config user.email "actions@users.noreply.github.com"
          for f in data/oddsapi_props_credits.csv data/oddsapi_props_coverage.json; do [ -f "$f" ] && git add -- "$f"; done
          git diff --cached --quiet && exit 0
          git commit -q -m "oddsapi props ${{ steps.decide.outputs.due }}: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git fetch -q origin main && git rebase -q origin/main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true; sleep 5
          done
          echo "::error::the ledger and coverage commit did not land after 3 attempts"; exit 1
      - name: Tell Discord when a pull failed
        # a due pull that failed at any step always alerts; a failure to even decide alerts from the cron backstops only, so a
        # dead feed is reported hourly at most and not on every 30-minute board push
        if: failure() && (steps.decide.outputs.due != '' || github.event_name != 'push')
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo "no DISCORD_WEBHOOK_URL secret: cannot alert"; exit 0; fi
          msg="🚨 Arc Lab stat-line capture FAILED (pull: ${{ steps.decide.outputs.due || 'could not decide what was due' }}, trigger: ${{ github.event_name }}). If the arc-lab-data checkout or push is the failed step, ARC_LAB_DATA_TOKEN has expired or lost access. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -o /dev/null -X POST -H "Content-Type: application/json" -d "{\"content\":\"${msg}\"}" "$DISCORD_WEBHOOK_URL"
