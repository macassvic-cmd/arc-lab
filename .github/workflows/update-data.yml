name: Update data and projections

on:
  schedule:
    - cron: "0 14 * * *"   # ~10am ET: overnight box scores + morning slate
    - cron: "30 21 * * *"  # ~5:30pm ET: refreshed rosters/injury tags before tip
  workflow_dispatch:
    inputs:
      backfill_start:
        description: "Backfill start date (YYYY-MM-DD), blank for a normal run"
        required: false
      backfill_end:
        description: "Backfill end date (YYYY-MM-DD)"
        required: false

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests numpy pandas
      - name: Fetch games
        working-directory: scripts
        env:
          START: ${{ inputs.backfill_start }}
          END: ${{ inputs.backfill_end }}
        run: |
          if [ -n "$START" ]; then
            python fetch_games.py --start "$START" ${END:+--end "$END"}
          else
            python fetch_games.py
          fi
      - name: Settle paper log
        working-directory: scripts
        run: python paper_log.py settle
      - name: Play-by-play store + first-basket labels (ESPN, no credits)
        working-directory: scripts
        run: |
          python pbp_store.py
          python first_basket.py backfill
          python first_shot.py backfill   # first-shot labels (the first-basket model's grading target)
      - name: Grade the first-basket log (last pre-tip snapshot vs first-shot labels; merged into performance.json by the ladder grade)
        working-directory: scripts
        run: python first_basket_model.py grade   # live by CEO override 2026-10-21; the gate verdict (FAIL) stands in docs/data/first_basket_gate.json
      - name: Grade the ladder log (last pre-tip snapshot vs box scores)
        working-directory: scripts
        run: python ladder_log.py grade
      - name: PrizePicks FP pricing (repo copy data/pp_fantasy_lines.json; standard lines, pre-tip captures only; a copy older than 26 h = no PP lines)
        working-directory: scripts
        run: |
          if [ -f ../data/pp_fantasy_lines.json ]; then python fantasy_points.py price_pp ../data/pp_fantasy_lines.json; else echo "no data/pp_fantasy_lines.json yet: the scraper hook has not delivered a PrizePicks copy"; fi
      - name: Grade the fantasy-points log (last pre-tip FP distribution vs box-score FP; UD lines from data/fp_prices.csv, PP lines from data/pp_prices.csv)
        working-directory: scripts
        run: python fantasy_points.py grade
      - name: Grade the FP v2 log (one row per line, DNP void, calibration verdict at 200, market test at 800; backtests/fantasy_points_v2_rule.md)
        working-directory: scripts
        run: python fp_v2.py grade
      - name: Assign positions
        working-directory: scripts
        run: python positions.py
      - name: Build model
        working-directory: scripts
        env:
          ODDSBLAZE_API_KEY: ${{ secrets.ODDSBLAZE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python build_model.py
      - name: Snapshot paper log
        working-directory: scripts
        run: python paper_log.py snapshot
      - name: Ladder log snapshot (append-only, pre-tip rows only)
        working-directory: scripts
        run: python ladder_log.py snapshot
      - name: Fantasy-points log snapshot (append-only, pre-tip rows only; frozen data/fp_priors.json)
        working-directory: scripts
        run: python fantasy_points.py snapshot
      - name: FP v2 log snapshot (append-only, pre-tip rows only; frozen pair data/fp_v2_params.json, frozen map data/fp_v2_recal.json)
        working-directory: scripts
        run: python fp_v2.py snapshot
      - name: Fantasy-points pricing study (repo board copy data/board_latest.json; refuses a capture older than the slate or 12 h)
        working-directory: scripts
        run: |
          if [ -f ../data/board_latest.json ]; then python fantasy_points.py price ../data/board_latest.json; else echo "no data/board_latest.json yet: the scraper hook has not delivered a capture"; fi
      - name: PrizePicks FP pricing, second pass (lines whose FP log row was written by this run's snapshot; idempotent)
        working-directory: scripts
        run: |
          if [ -f ../data/pp_fantasy_lines.json ]; then python fantasy_points.py price_pp ../data/pp_fantasy_lines.json; else echo "no data/pp_fantasy_lines.json yet"; fi
      - name: FP v2 pricing (UD standard FP lines with both sides' prices, PP standard lines; calibrated P(over) through the frozen map)
        working-directory: scripts
        run: |
          if [ -f ../data/board_latest.json ]; then python fp_v2.py price ../data/board_latest.json; else echo "no data/board_latest.json yet"; fi
          if [ -f ../data/pp_fantasy_lines.json ]; then python fp_v2.py price_pp ../data/pp_fantasy_lines.json; else echo "no data/pp_fantasy_lines.json yet"; fi
      - name: First-basket log snapshot (append-only, pre-tip rows only; frozen data/first_basket_params.json)
        working-directory: scripts
        run: python first_basket_model.py snapshot
      - name: First-basket market odds (The Odds API player_first_basket, 1 credit per untipped game; display layer, logged pre-tip)
        working-directory: scripts
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python first_basket_odds.py pull
      - name: Validate published JSON (strict parse, no NaN/Infinity; a bad file fails the build instead of blanking a page)
        working-directory: scripts
        run: python validate_site_json.py
      - name: Commit
        run: |
          git config user.name "arc-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet && exit 0
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
