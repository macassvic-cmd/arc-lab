name: Lines watchdog

# Every 15 minutes, all day: health.py only acts inside the slate-driven window (90 minutes before the day's earliest tip to
# 3 hours after the latest tip, from data/slate.json), so afternoon tips are covered and quiet hours cost one no-op run.
# The paper-log snapshot runs alongside so the last one before tip is the close.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Check lines freshness
        working-directory: scripts
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python health.py
      - name: Snapshot paper log (closing lines)
        working-directory: scripts
        run: python paper_log.py snapshot
      - name: Commit state
        run: |
          git config user.name "arc-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -f data/health_state.json ] && git add data/health_state.json
          [ -f data/paper_log.csv ] && git add data/paper_log.csv
          git diff --cached --quiet && exit 0
          git commit -m "health: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
