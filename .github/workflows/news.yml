name: Injury news

on:
  repository_dispatch:
    types: [injury_news]

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests numpy pandas
      - name: Ingest news and re-run projections
        working-directory: scripts
        env:
          NEWS_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          ODDSBLAZE_API_KEY: ${{ secrets.ODDSBLAZE_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python ingest_news.py
          if [ -f ../data/player_games.csv ]; then python build_model.py; fi
          python paper_log.py snapshot
      - name: Commit
        run: |
          git config user.name "arc-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          [ -f data/health_state.json ] && git add data/health_state.json
          [ -f data/paper_log.csv ] && git add data/paper_log.csv
          git diff --cached --quiet && exit 0
          git commit -m "news: $(date -u +%H:%M:%SZ)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
